name: Markdown Link Check

# Validates links in the documentation.
#
# The job runs in two modes, because internal and external links fail for
# completely different reasons and only one of them is the repository's fault.
#
#   Pull requests and pushes -> INTERNAL links only.
#     Relative paths and heading anchors are entirely within the repository's
#     control, so a failure is always a real defect the author can fix, and the
#     result is deterministic. This is what gates a merge.
#
#   Weekly schedule and manual runs -> INTERNAL + EXTERNAL.
#     External link rot is real and worth catching, but a third party being
#     down, rate-limiting a CI runner, or refusing a HEAD request is not a
#     defect in this pull request. Gating merges on other people's uptime makes
#     the check non-deterministic and trains everyone to ignore it.
#
# This split was introduced after three consecutive PR runs failed on three
# different external hosts (a 429 from docs.ansible.com, a connection failure
# to bgp.tools) while a genuinely broken internal link sat undetected behind
# them, in a directory whose step ended with `|| true`.

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/markdown-links.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '.github/workflows/markdown-links.yml'
  workflow_dispatch: # Manual trigger; also checks external links
  schedule:
    # Weekly on Mondays at 00:00 UTC to catch external link rot
    - cron: '0 0 * * 1'

# Cancel outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest

    env:
      # Only the scheduled and manual runs reach out to the network.
      CHECK_EXTERNAL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      # `mlc_config.json` at the repository root is the single source of truth.
      # The only thing added here is the PR-mode ignore, so that editing the
      # committed file actually changes behaviour -- previously this step wrote
      # its own config over the top and the committed one was inert.
      - name: Build effective link check configuration
        run: |
          python3 - <<'PY'
          import json, os

          with open("mlc_config.json") as fh:
              config = json.load(fh)

          if os.environ["CHECK_EXTERNAL"] != "1":
              config["ignorePatterns"].append({
                  "pattern": "^https?://",
                  "comment": "PR mode: external links are checked by the weekly scheduled run",
              })
              print("external link checking: disabled (PR mode)")
          else:
              print("external link checking: ENABLED")

          with open("mlc_effective.json", "w") as fh:
              json.dump(config, fh, indent=2)
          PY

      - name: Check links
        id: check
        run: |
          if [ "$CHECK_EXTERNAL" = "1" ]; then
            echo "Mode: internal + external links"
          else
            echo "Mode: internal links only (external links run on the weekly schedule)"
          fi
          echo ""

          # Collect the file list first so the loop is not inside a pipeline --
          # a `while read` fed by a pipe runs in a subshell, where a failure
          # count cannot escape.
          find README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md AUTHORS.md \
               SUPPORT.md docs/ to-dos/ -name '*.md' -type f 2>/dev/null \
            | sort > files.txt

          total=$(wc -l < files.txt)
          echo "Checking $total files"
          echo ""

          failed=0
          failed_files=""

          while read -r file; do
            if ! output=$(markdown-link-check "$file" --config mlc_effective.json 2>&1); then
              failed=$((failed + 1))
              failed_files="${failed_files}${file}"$'\n'
              echo "::group::FAILED: $file"
              echo "$output" | grep -E '\[✖\]|ERROR' || echo "$output"
              echo "::endgroup::"
            fi
          done < files.txt

          # Every file is checked before the job fails, so one broken link does
          # not hide the rest. The previous version exited on the first failure
          # and swallowed to-dos/ failures entirely with `|| true`.
          {
            echo "files_checked=$total"
            echo "files_failed=$failed"
          } >> "$GITHUB_OUTPUT"

          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "$failed of $total files contain broken links:"
            printf '%s' "$failed_files"
            exit 1
          fi

          echo ""
          echo "All $total files passed."

      - name: Report
        if: always()
        run: |
          {
            echo "# Markdown Link Check"
            echo ""
            if [ "$CHECK_EXTERNAL" = "1" ]; then
              echo "**Mode:** internal + external links (scheduled/manual run)"
            else
              echo "**Mode:** internal links only — relative paths and heading anchors."
              echo "External links are validated by the weekly scheduled run, so that a"
              echo "third party being down cannot block a merge."
            fi
            echo ""
            echo "- Files checked: ${{ steps.check.outputs.files_checked || 'n/a' }}"
            echo "- Files with broken links: ${{ steps.check.outputs.files_failed || 'n/a' }}"
            echo ""
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo "Result: **passed**"
            else
              echo "Result: **failed** — see the job log for the offending links."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
